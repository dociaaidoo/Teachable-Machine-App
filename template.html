<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Desk Object Classifier</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --text: #1d2330; --muted: #6b7280;
    --line: #e3e6eb; --accent: #2f6fed; --bar: #e9edf3;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #14171c; --card: #1d2128; --text: #e8eaee; --muted: #9aa1ad; --line: #2c323b; --accent: #6c9cff; --bar: #2a3039; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, -apple-system, sans-serif; }
  main { max-width: 440px; margin: 48px auto; padding: 0 16px; }
  h1 { font-size: 1.4rem; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 20px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }

  #drop { display: flex; align-items: center; justify-content: center; min-height: 220px; border: 2px dashed var(--line);
          border-radius: 10px; cursor: pointer; overflow: hidden; color: var(--muted); text-align: center; }
  #drop.over { border-color: var(--accent); }
  #drop img, #drop video { display: none; width: 100%; max-height: 320px; object-fit: contain; }
  #drop.has-media { border-style: solid; }
  #drop.has-media #hint { display: none; }

  .actions { display: flex; gap: 8px; margin-top: 12px; }
  button { flex: 1; padding: 9px; border-radius: 8px; border: 1px solid var(--line); background: var(--card);
           color: var(--text); font: inherit; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button:disabled { opacity: .5; cursor: default; }

  #result { margin: 18px 0 10px; font-size: 1.15rem; font-weight: 600; }
  .row { display: grid; grid-template-columns: 100px 1fr 52px; gap: 10px; align-items: center; margin: 6px 0; font-size: .9rem; }
  .track { height: 8px; background: var(--bar); border-radius: 4px; overflow: hidden; }
  .fill { height: 100%; width: 0; background: var(--accent); border-radius: 4px; transition: width .25s; }
  .pct { text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<main>
  <h1>Desk Object Classifier</h1>
  <p class="sub">Is it a pen, a phone or a water bottle?</p>

  <div class="card">
    <div id="drop">
      <span id="hint">Click or drop a photo here</span>
      <img id="preview" alt="Selected photo">
      <video id="webcam" autoplay playsinline muted></video>
    </div>
    <input type="file" id="photo" accept="image/*" hidden>
    <div class="actions">
      <button id="uploadButton" class="primary" disabled>Choose photo</button>
      <button id="webcamButton" disabled>Use webcam</button>
    </div>

    <div id="result">Loading model…</div>
    <div id="scores"></div>
  </div>
</main>

  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.7.4/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8.5/dist/teachablemachine-image.min.js"></script>
  <script>
    // Model exported from Teachable Machine, embedded by build_app.py
    const MODEL = __MODEL__;
    const METADATA = __METADATA__;
    const WEIGHTS_BASE64 = "__WEIGHTS__";

    const photo = document.getElementById("photo");
    const drop = document.getElementById("drop");
    const preview = document.getElementById("preview");
    const result = document.getElementById("result");
    const scores = document.getElementById("scores");
    const webcam = document.getElementById("webcam");
    const uploadButton = document.getElementById("uploadButton");
    const webcamButton = document.getElementById("webcamButton");
    let model;
    let stream = null;

    // One bar per class, in the model's label order
    function buildScores() {
      scores.innerHTML = METADATA.labels
        .map(label => `<div class="row"><span>${label}</span><div class="track"><div class="fill"></div></div><span class="pct">–</span></div>`)
        .join("");
    }

    async function showPrediction(source) {
      const predictions = await model.predict(source);
      const top = predictions.reduce((a, b) => (b.probability > a.probability ? b : a));
      result.textContent = `${top.className} · ${(top.probability * 100).toFixed(1)}%`;
      predictions.forEach((p, i) => {
        const row = scores.children[i];
        row.querySelector(".fill").style.width = `${p.probability * 100}%`;
        row.querySelector(".pct").textContent = `${(p.probability * 100).toFixed(1)}%`;
      });
    }

    function showMedia(el) {
      preview.style.display = el === preview ? "block" : "none";
      webcam.style.display = el === webcam ? "block" : "none";
      drop.classList.toggle("has-media", Boolean(el));
    }

    function stopWebcam() {
      if (!stream) return;
      stream.getTracks().forEach(track => track.stop());
      stream = null;
      showMedia(null);
      webcamButton.textContent = "Use webcam";
    }

    async function webcamLoop() {
      while (stream) {
        if (webcam.readyState >= 2) await showPrediction(webcam);
        await new Promise(resolve => setTimeout(resolve, 300));
      }
    }

    function loadFile(file) {
      if (!file || !file.type.startsWith("image/")) return;
      stopWebcam();
      preview.src = URL.createObjectURL(file);
      showMedia(preview);
    }

    webcamButton.addEventListener("click", async () => {
      if (stream) return stopWebcam();
      try {
        stream = await navigator.mediaDevices.getUserMedia({ video: true });
      } catch (err) {
        result.textContent = "Could not open the webcam: " + err.message;
        return;
      }
      webcam.srcObject = stream;
      showMedia(webcam);
      webcamButton.textContent = "Stop webcam";
      webcamLoop();
    });

    uploadButton.addEventListener("click", () => photo.click());
    drop.addEventListener("click", () => { if (model && !stream) photo.click(); });
    photo.addEventListener("change", () => { loadFile(photo.files[0]); photo.value = ""; });
    drop.addEventListener("dragover", e => { e.preventDefault(); drop.classList.add("over"); });
    drop.addEventListener("dragleave", () => drop.classList.remove("over"));
    drop.addEventListener("drop", e => {
      e.preventDefault();
      drop.classList.remove("over");
      if (model) loadFile(e.dataTransfer.files[0]);
    });
    preview.addEventListener("load", () => showPrediction(preview));

    async function loadModel() {
      const bytes = Uint8Array.from(atob(WEIGHTS_BASE64), c => c.charCodeAt(0));
      model = await tmImage.loadFromFiles(
        new File([JSON.stringify(MODEL)], "model.json", { type: "application/json" }),
        new File([bytes], "weights.bin"),
        new File([JSON.stringify(METADATA)], "metadata.json", { type: "application/json" })
      );
      result.textContent = "Ready. Add a photo to classify it.";
      uploadButton.disabled = false;
      webcamButton.disabled = false;
    }

    buildScores();
    loadModel().catch(err => { result.textContent = "Could not load the model: " + err.message; });
  </script>
</body>
</html>
